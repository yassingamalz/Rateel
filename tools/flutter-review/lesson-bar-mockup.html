<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Readex;src:url(ReadexPro.ttf)}
:root{--u:8.53px}
*{box-sizing:border-box;margin:0}
body{width:100vw;height:100vh;overflow:hidden;font-family:Readex;background:radial-gradient(ellipse at 50% 0%,#07362A,#00271D 75%);position:relative}
.content{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:all .3s}
.content img{width:calc(110*var(--u));}
.menu .content{filter:blur(4px) brightness(.8);transform:scale(.98)}
.veil{position:absolute;inset:0;background:rgba(0,20,14,.45);opacity:0}
.menu .veil{opacity:1}
.btn{position:absolute;width:calc(7.5*var(--u));height:calc(7.5*var(--u));border-radius:50%;
 border:calc(.2*var(--u)) solid #D8C35A;background:radial-gradient(circle,rgba(242,182,35,.08),rgba(242,182,35,.24));
 box-shadow:0 0 calc(2*var(--u)) rgba(242,182,35,.22);display:flex;align-items:center;justify-content:center}
.btn svg{width:calc(3.6*var(--u));height:calc(3.6*var(--u))}
.main{top:calc(3*var(--u));right:calc(3*var(--u))}
.menu .main{background:linear-gradient(#F8C343,#E2A51E);border-color:#FFDA6B;box-shadow:0 0 0 calc(1.2*var(--u)) rgba(226,165,30,.25),0 0 calc(2.4*var(--u)) rgba(242,182,35,.45)}
.item{top:calc(3*var(--u));opacity:0}
.menu .item{opacity:1}
.i1{right:calc(12*var(--u))} .i2{right:calc(21*var(--u))}
.lbl{position:absolute;top:calc(11.4*var(--u));width:calc(7.5*var(--u));text-align:center;color:#F4EAD0;font-size:calc(2.2*var(--u));opacity:0}
.menu .lbl{opacity:.85}
/* option A: capsule */
.cap{position:absolute;top:calc(4.2*var(--u));left:calc(3*var(--u));width:calc(34*var(--u));height:calc(5*var(--u));border-radius:calc(2.5*var(--u));
 border:calc(.23*var(--u)) solid #245843;background:rgba(1,46,32,.55);box-shadow:0 calc(.6*var(--u)) calc(2.2*var(--u)) rgba(0,0,0,.4);padding:calc(.9*var(--u))}
.track{position:relative;width:100%;height:100%;border-radius:calc(1.6*var(--u));background:#0F3F2E;box-shadow:inset 0 calc(.15*var(--u)) calc(.4*var(--u)) rgba(0,0,0,.5);overflow:hidden}
.fill{position:absolute;right:0;top:0;bottom:0;border-radius:calc(1.6*var(--u));background:linear-gradient(#FFD95A,#EDB120 55%,#D9A11C);box-shadow:0 0 calc(1.2*var(--u)) rgba(242,182,35,.5)}
.fill::after{content:'';position:absolute;left:0;top:10%;bottom:10%;width:calc(.5*var(--u));border-radius:50%;background:#FFF3C2;box-shadow:0 0 calc(1*var(--u)) #FFE07A}
.sheen{position:absolute;left:8%;right:8%;top:12%;height:30%;border-radius:9px;background:rgba(255,255,255,.28)}
.num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#FFFDF5;font-size:calc(2.3*var(--u));font-weight:500;text-shadow:0 0 calc(.6*var(--u)) rgba(0,0,0,.75);direction:ltr}
/* option B: wide */
.wide{position:absolute;top:calc(6.1*var(--u));left:calc(3*var(--u));right:calc(14*var(--u));height:calc(1.3*var(--u));border-radius:9px;background:#265343;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.wide .fill{border-radius:9px}
.wide .fill::after{top:-60%;bottom:-60%;width:calc(1.6*var(--u));left:calc(-.4*var(--u));background:radial-gradient(circle,#FFF6CF,#FFD95A 45%,rgba(255,217,90,0) 72%);box-shadow:none}
.cnt{position:absolute;top:calc(4.3*var(--u));left:calc(3*var(--u));transform:translateX(0);padding:calc(.4*var(--u)) calc(1.6*var(--u));border-radius:99px;background:#062D20;border:calc(.23*var(--u)) solid #EDB120;color:#EDB120;font-size:calc(2.3*var(--u));direction:ltr;display:none}
.B .cap{display:none}.A .wide{display:none}
.B.menu .wide{right:calc(31*var(--u))}
.B .cnt{display:block;top:calc(8.6*var(--u))}
</style></head><body>
<div class="content"><img src="card.png"></div><div class="veil"></div>
<div class="cap"><div class="track"><div class="fill" style="width:42%"><div class="sheen"></div></div><div class="num">42/100</div></div></div>
<div class="wide"><div class="fill" style="width:42%"></div></div>
<div class="cnt">42/100</div>
<div class="btn item i2"><svg viewBox="0 0 24 24" fill="none" stroke="#F7F8F8" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.4-5.5"/><path d="M19.6 3.6v4.3h-4.3"/></svg></div>
<div class="btn item i1"><svg viewBox="0 0 24 24" fill="none" stroke="#F7F8F8" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M13.5 5.2 20 12l-6.5 6.8"/></svg></div>

<div class="btn main"><svg id="g" viewBox="0 0 24 24"></svg></div>
<script>
const q=new URLSearchParams(location.search);document.body.className=(q.get('opt')||'A')+(q.get('menu')=='1'?' menu':'');
document.documentElement.style.setProperty('--u',(innerHeight/100)+'px');
document.getElementById('g').innerHTML=q.get('menu')=='1'?'<path d="M8 5.2v13.6L19 12z" fill="#132C1A" stroke="#132C1A" stroke-width="1.6" stroke-linejoin="round"/>':'<rect x="6" y="5" width="3.6" height="14" rx="1.4" fill="#FCF1D0"/><rect x="14.4" y="5" width="3.6" height="14" rx="1.4" fill="#FCF1D0"/>';
</script></body></html>
