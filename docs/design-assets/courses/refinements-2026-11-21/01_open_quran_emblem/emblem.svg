<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="2000" height="1000" fill="none">
  <defs>
    <linearGradient id="goldFill" x1="40" y1="20" x2="160" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBD35A"/>
      <stop offset="1" stop-color="#E3B03B"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="20" y1="15" x2="180" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBD35A"/>
      <stop offset="1" stop-color="#E3B03B"/>
    </linearGradient>
  </defs>

  <!-- outer rim -->
  <path d="M49 24
           C62 24, 82 24, 96 34
           C98 36, 99 37, 100 38
           C101 37, 102 36, 104 34
           C118 24, 138 24, 151 24
           L159 64
           C145 64, 122 63, 106 70
           C103 71.4, 101.5 73.2, 100 74.8
           C98.5 73.2, 97 71.4, 94 70
           C78 63, 55 64, 41 64
           Z"
        fill="url(#goldStroke)"/>

  <!-- left page border cutout -->
  <path d="M56 29
           C67 29, 82 29.5, 94 37.2
           L94 67.2
           C81 59.8, 63 58.5, 47 58.5
           Z"
        fill="transparent"/>
  <!-- right page border cutout -->
  <path d="M106 37.2
           C118 29.5, 133 29, 144 29
           L153 58.5
           C137 58.5, 119 59.8, 106 67.2
           Z"
        fill="transparent"/>

  <!-- pages -->
  <path d="M55 31
           C67 31, 81 31.5, 93 38.5
           L93 64
           C80 57.5, 64 56.5, 50 56.5
           Z"
        fill="url(#goldFill)"/>
  <path d="M107 38.5
           C119 31.5, 133 31, 145 31
           L150 56.5
           C136 56.5, 120 57.5, 107 64
           Z"
        fill="url(#goldFill)"/>

  <!-- inner rim accents -->
  <path d="M58 33.8 C68 33.8, 80 34.5, 91 40.5" stroke="#F9D76A" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M109 40.5 C120 34.5, 132 33.8, 142 33.8" stroke="#F9D76A" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M53 58.5 C67 58.5, 80 59.8, 91.5 66" stroke="#C99224" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M108.5 66 C120 59.8, 133 58.5, 147 58.5" stroke="#C99224" stroke-width="2.2" stroke-linecap="round"/>

  <!-- central spine -->
  <path d="M98.8 36.7 C99.3 39.8, 99.6 48.5, 99.6 69.5" stroke="#C99224" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M101.2 36.7 C100.7 39.8, 100.4 48.5, 100.4 69.5" stroke="#F9D76A" stroke-width="2.3" stroke-linecap="round"/>

  <!-- lower base curve -->
  <path d="M41 64.1
           C55 64.1, 77 63.2, 94.5 70.9
           C97 72, 98.8 74.2, 100 76.2
           C101.2 74.2, 103 72, 105.5 70.9
           C123 63.2, 145 64.1, 159 64.1"
        stroke="url(#goldStroke)" stroke-width="4.8" stroke-linecap="round"/>

  <!-- small base under spine -->
  <path d="M100 78.6
           C96.4 78.6, 94.2 76.9, 94.2 74.8
           C94.2 73.1, 96 72, 97.8 72
           C98.9 72, 99.5 72.6, 100 73.2
           C100.5 72.6, 101.1 72, 102.2 72
           C104 72, 105.8 73.1, 105.8 74.8
           C105.8 76.9, 103.6 78.6, 100 78.6Z"
        fill="url(#goldStroke)"/>
</svg>
