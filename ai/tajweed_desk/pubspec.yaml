name: tajweed_desk
description: "Rateel tajweed desk: interactive PC test of the Quran Muaalem model (not the Rateel app)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  onnxruntime:
    path: third_party/onnxruntime
  path_provider: ^2.1.6
  record: ^7.2.0
  tajweed_core:
    path: ../tajweed_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/husary/
  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro.ttf
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
